<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta http-equiv="Cache-Control" content="no-store, no-cache, must-revalidate, max-age=0" />
  <meta http-equiv="Pragma" content="no-cache" />
  <meta http-equiv="Expires" content="0" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <meta name="mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="default" />
  <meta name="theme-color" content="#14305A" />
  <title>{% block title %}My Schedule{% endblock %} — Mid Florida Surgical</title>
  <link rel="manifest" href="/static/manifest.json" />
  <link rel="apple-touch-icon" href="/static/apple-touch-icon.png" sizes="180x180" />
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=DM+Sans:opsz,wght@9..40,300;9..40,400;9..40,500;9..40,600;9..40,700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="/static/css/tailwind.css" />
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css" />
  {% block head %}{% endblock %}
  <style>
    :root {
      --ease-ios-out: cubic-bezier(0.32, 0.72, 0, 1);
      --ease-ios-in-out: cubic-bezier(0.4, 0, 0.2, 1);
      --dur-sm: 0.22s;
      --dur-md: 0.42s;
    }
    @media (prefers-reduced-motion: reduce) {
      *, *::before, *::after {
        animation-duration: 0.01ms !important;
        animation-iteration-count: 1 !important;
        transition-duration: 0.01ms !important;
      }
    }
    * { -webkit-tap-highlight-color: transparent; box-sizing: border-box; }
    body, button, a { touch-action: manipulation; }
    body {
      font-family: -apple-system, 'DM Sans', BlinkMacSystemFont, sans-serif;
      background:
        radial-gradient(ellipse 140% 70% at 50% -20%, rgba(0,90,200,.45) 0%, rgba(0,150,220,.15) 40%, transparent 70%),
        radial-gradient(ellipse 100% 60% at 90% 110%, rgba(0,100,180,.30) 0%, transparent 55%),
        radial-gradient(ellipse  80% 50% at -10% 80%, rgba(100,180,255,.20) 0%, transparent 55%),
        linear-gradient(175deg, #cfe0f5 0%, #ddeaf8 30%, #e8f2fc 55%, #f2f8ff 80%, #eaf3ff 100%);
      background-attachment: fixed;
      min-height: 100vh;
      padding-bottom: calc(72px + env(safe-area-inset-bottom));
    }
    .bottom-nav {
      position: fixed; bottom: 0; left: 0; right: 0;
      background: rgba(255,255,255,.82);
      backdrop-filter: blur(22px) saturate(1.8);
      -webkit-backdrop-filter: blur(22px) saturate(1.8);
      border-top: 1px solid rgba(20,48,90,.14);
      display: flex; z-index: 100;
      padding-bottom: env(safe-area-inset-bottom);
      box-shadow: 0 -2px 16px rgba(0,70,160,.08);
    }
    .nav-btn {
      flex: 1; display: flex; flex-direction: column; align-items: center;
      gap: 2px; padding: 10px 4px 10px; font-size: 10px; font-weight: 600;
      color: #7A90A8; text-decoration: none;
      letter-spacing: 0.01em;
      transition: color var(--dur-sm) var(--ease-ios-in-out), transform 0.12s var(--ease-ios-out);
    }
    .nav-btn i { font-size: 1.25rem; transition: transform 0.2s var(--ease-ios-out); }
    .nav-btn:active { transform: scale(0.96); }
    .nav-btn.active { color: #0066CC; }
    .nav-btn.active i { transform: scale(1.06); }
  </style>
</head>
<body>
{% if desktop_preview %}
<div class="px-3 py-2 text-center text-xs font-semibold text-amber-900 bg-amber-100 border-b border-amber-200">
  <i class="fa-solid fa-display mr-1"></i>Desktop preview — logged in as {{ surgeon.full_name }}.
  <a href="/surgeon/logout?next=/admin/surgeons" class="underline text-amber-950 hover:text-amber-700 ml-1">Exit preview</a>
</div>
{% endif %}
{% block content %}{% endblock %}

<p class="text-center text-[10px] text-slate-400 px-2 pb-1" style="margin-bottom: -0.25rem;">Build <span class="font-mono font-semibold text-slate-500">{{ app_version|default('?') }}</span></p>

<nav class="bottom-nav">
  <a href="/surgeon/schedule" class="nav-btn {% if request.url.path == '/surgeon/schedule' %}active{% endif %}">
    <i class="fa-solid fa-calendar-days"></i> Schedule
  </a>
  <a href="/surgeon/availability" class="nav-btn {% if request.url.path == '/surgeon/availability' %}active{% endif %}">
    <i class="fa-solid fa-calendar-check"></i> Availability
  </a>
  <a href="/surgeon/request-off" class="nav-btn {% if request.url.path == '/surgeon/request-off' %}active{% endif %}">
    <i class="fa-solid fa-umbrella-beach"></i> Days Off
  </a>
  <a href="/surgeon/patients" class="nav-btn {% if request.url.path == '/surgeon/patients' %}active{% endif %}">
    <i class="fa-solid fa-hospital-user"></i> Patients
  </a>
</nav>

<script>
(function () {
  var embedded = {{ (app_version|default("?"))|tojson }};
  var loopKey = 'cal_v_reload';
  function bumpLoop() {
    try {
      var n = parseInt(sessionStorage.getItem(loopKey) || '0', 10) + 1;
      sessionStorage.setItem(loopKey, String(n));
      return n;
    } catch (e) { return 1; }
  }
  function clearLoop() {
    try { sessionStorage.removeItem(loopKey); } catch (e) {}
  }
  function checkStaleBuild() {
    if (!embedded || embedded === '?') return;
    var u = '/health?_=' + Date.now();
    fetch(u, { cache: 'no-store', credentials: 'same-origin', headers: { Accept: 'application/json' } })
      .then(function (r) { return r.ok ? r.json() : {}; })
      .then(function (j) {
        var live = (j && j.version) ? String(j.version).trim() : '';
        if (!live || live === embedded) {
          clearLoop();
          return;
        }
        if (bumpLoop() > 3) return;
        var loc = new URL(window.location.href);
        loc.searchParams.set('cal_v', live);
        window.location.replace(loc.toString());
      })
      .catch(function () {});
  }
  checkStaleBuild();
  document.addEventListener('visibilitychange', function () {
    if (document.visibilityState === 'visible') checkStaleBuild();
  });
  window.addEventListener('pageshow', function (ev) {
    if (ev.persisted) checkStaleBuild();
  });
  if ('serviceWorker' in navigator) {
    var swUrl = '/static/sw.js?v={{ (app_version|default("0"))|urlquote }}';
    navigator.serviceWorker.register(swUrl).then(function (reg) {
      document.addEventListener('visibilitychange', function () {
        if (document.visibilityState === 'visible') reg.update();
      });
    }).catch(function () {});
  }
})();
</script>
{% block scripts %}{% endblock %}
</body>
</html>
