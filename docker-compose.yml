# Compatibility compose entry from the repository root.
# The CAL server source now lives under ./server.
services:
  cal_api:
    build:
      context: ./server
      dockerfile: Dockerfile
      args:
        APP_VERSION: ${CAL_APP_VERSION:-unknown}
        GIT_COMMIT: ${CAL_GIT_COMMIT:-unknown}
        GIT_BRANCH: ${CAL_GIT_BRANCH:-unknown}
        GIT_REMOTE: ${CAL_GIT_REMOTE:-unknown}
    image: cal_api:local
    pull_policy: build
    container_name: cal_api
    restart: unless-stopped
    env_file: .env
    environment:
      TZ: America/New_York
    ports:
      - "127.0.0.1:3005:3005"
    networks:
      - atlas-net
      - atlas_default
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:3005/health"]
      interval: 30s
      timeout: 10s
      retries: 3

networks:
  atlas-net:
    external: true
  atlas_default:
    external: true
