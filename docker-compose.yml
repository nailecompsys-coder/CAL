# Deploy from THIS repo only:
#   ./scripts/rebuild-cal-api.sh
# or: docker compose build --no-cache cal_api && docker compose up -d cal_api
#
# `image: cal_api:local` + `pull_policy: build` = tag the local Dockerfile build and do
# not pull a registry image (avoids stale tags like 1.3.0-beta5 shadowing your tree).
# Requires Docker Compose v2.24+; if `pull_policy` errors, remove that line and keep `image:`.
services:
  cal_api:
    build:
      context: .
      dockerfile: Dockerfile
      args:
        APP_VERSION: ${CAL_APP_VERSION:-unknown}
        GIT_COMMIT: ${CAL_GIT_COMMIT:-unknown}
        GIT_BRANCH: ${CAL_GIT_BRANCH:-unknown}
        GIT_REMOTE: ${CAL_GIT_REMOTE:-unknown}
    image: cal_api:local
    pull_policy: build
    container_name: cal_api
    restart: unless-stopped
    env_file: .env
    ports:
      - "127.0.0.1:3005:3005"
    networks:
      - atlas-net
      - atlas_default
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:3005/health"]
      interval: 30s
      timeout: 10s
      retries: 3

networks:
  atlas-net:
    external: true
  atlas_default:
    external: true
