<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" /><meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Admin Login — Mid Florida Surgical</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=DM+Sans:opsz,wght@9..40,300;9..40,400;9..40,500;9..40,600;9..40,700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="/static/css/tailwind.css" />
  <style>
    body { font-family: -apple-system, 'DM Sans', BlinkMacSystemFont, sans-serif; }
  </style>
</head>
<body class="min-h-screen flex items-center justify-center" style="background: linear-gradient(160deg, #ddeaf8 0%, #e8f2fc 40%, #f2f8ff 70%, #eaf3ff 100%);">
<div class="w-full max-w-sm mx-4">
  <div class="text-center mb-8">
    {% if settings and settings.logo_filename %}
    <img src="/static/uploads/{{ settings.logo_filename }}" alt="Logo" class="h-16 mx-auto mb-4 object-contain" />
    {% else %}
    <div class="w-14 h-14 rounded-2xl flex items-center justify-center mx-auto mb-4 shadow-lg" style="background: linear-gradient(155deg, #1a7cf8, #0044c0);">
      <svg width="28" height="28" viewBox="0 0 24 24" fill="none"><path d="M12 2L2 7v10l10 5 10-5V7L12 2z" stroke="white" stroke-width="1.5" stroke-linejoin="round"/><path d="M12 12V22M12 12L2 7M12 12L22 7" stroke="white" stroke-width="1.5"/></svg>
    </div>
    {% endif %}
    <h1 class="text-2xl font-bold text-slate-800">{% if settings %}{{ settings.practice_name }}{% else %}Mid Florida Surgical{% endif %}</h1>
    <p class="text-slate-500 text-sm mt-1">Admin Portal</p>
  </div>

  <div class="bg-white rounded-2xl border border-slate-200 p-6" style="box-shadow: 0 2px 8px rgba(0,0,0,.06), 0 0 1px rgba(0,0,0,.04);">
    {% if error %}
    <div class="bg-rose-50 border border-rose-200 text-rose-700 text-sm px-4 py-3 rounded-lg mb-4">
      {{ error }}
    </div>
    {% endif %}

    <form method="post" action="/admin/login" class="space-y-4">
      <div>
        <label class="block text-xs font-semibold text-slate-500 mb-1 uppercase tracking-wide">Username or Email</label>
        <input type="text" name="username" required autofocus
          class="w-full px-3 py-2.5 rounded-lg border border-slate-200 text-sm text-slate-800 focus:outline-none focus:ring-2 focus:ring-blue-600 focus:border-transparent"
          placeholder="Username or email" />
      </div>
      <div>
        <label class="block text-xs font-semibold text-slate-500 mb-1 uppercase tracking-wide">Password</label>
        <input type="password" name="password" required
          class="w-full px-3 py-2.5 rounded-lg border border-slate-200 text-sm text-slate-800 focus:outline-none focus:ring-2 focus:ring-blue-600 focus:border-transparent" />
      </div>
      <button type="submit"
        class="w-full text-white py-2.5 rounded-lg font-semibold transition-opacity hover:opacity-90"
        style="background: linear-gradient(155deg, #1a7cf8, #0044c0); box-shadow: 0 6px 22px rgba(0,70,200,.35);">
        Sign In
      </button>
    </form>
  </div>
</div>
</body>
</html>
