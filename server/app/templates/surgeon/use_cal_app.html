<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Use the CAL App — Mid Florida Surgical</title>
  <link href="https://fonts.googleapis.com/css2?family=DM+Sans:opsz,wght@9..40,400;9..40,600;9..40,700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="/static/css/tailwind.css" />
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css" />
  <style>body { font-family: -apple-system, 'DM Sans', BlinkMacSystemFont, sans-serif; }</style>
</head>
<body class="bg-slate-50 min-h-screen">
  <div class="min-h-screen flex items-center justify-center p-8">
    <div class="max-w-md w-full bg-white border border-slate-200 rounded-2xl shadow-sm p-8 text-center space-y-4">
      <div class="mx-auto w-14 h-14 rounded-2xl bg-blue-50 text-blue-600 flex items-center justify-center">
        <i class="fa-solid fa-mobile-screen-button text-2xl"></i>
      </div>
      <h1 class="text-xl font-bold text-slate-800">Use the CAL app</h1>
      <p class="text-sm text-slate-600 leading-relaxed">
        The surgeon web calendar is retired. Surgeons sign in with the
        <strong>MFSA CAL</strong> iPhone or Android app (OTP by email or text).
      </p>
      <p class="text-sm text-slate-500 leading-relaxed">
        Schedulers and admins use the portal for desk work — call coverage, Block OR placement, and time off.
      </p>
      <div class="pt-2 flex flex-col gap-2">
        <a href="/admin/login" class="inline-flex justify-center items-center gap-2 bg-blue-600 text-white text-sm font-semibold px-4 py-2.5 rounded-xl hover:bg-blue-700">
          Portal login
        </a>
      </div>
    </div>
  </div>
</body>
</html>
