# Standalone Cal API — no external Docker networks required.
# Use on a host that does NOT have atlas-net / atlas_default:
#   CAL_APP_VERSION=$(tr -d '[:space:]' < server/VERSION) docker compose -f server/docker-compose.standalone.yml up --build -d
# Or: make deploy-cal-standalone
services:
  cal_postgres:
    image: postgres:16-alpine
    container_name: cal_postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${CAL_DB_NAME:-cal_prod}
      POSTGRES_USER: ${CAL_DB_USER:-cal_app}
      POSTGRES_PASSWORD: ${CAL_DB_PASSWORD:-change_me_cal_db_password}
    volumes:
      - cal_postgres_data:/var/lib/postgresql/data
    networks:
      - cal_internal
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${CAL_DB_USER:-cal_app} -d ${CAL_DB_NAME:-cal_prod}"]
      interval: 10s
      timeout: 5s
      retries: 10

  cal_api:
    build:
      context: .
      dockerfile: Dockerfile
      args:
        APP_VERSION: ${CAL_APP_VERSION:-unknown}
        GIT_COMMIT: ${CAL_GIT_COMMIT:-unknown}
        GIT_BRANCH: ${CAL_GIT_BRANCH:-unknown}
        GIT_REMOTE: ${CAL_GIT_REMOTE:-unknown}
    image: cal_api:local
    pull_policy: build
    container_name: cal_api
    restart: unless-stopped
    env_file: ../.env
    environment:
      TZ: America/New_York
    depends_on:
      cal_postgres:
        condition: service_healthy
    ports:
      - "${CAL_BIND_HOST:-0.0.0.0}:3005:3005"
    networks:
      - cal_internal
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:3005/health"]
      interval: 30s
      timeout: 10s
      retries: 3

networks:
  cal_internal:
    driver: bridge

volumes:
  cal_postgres_data:
